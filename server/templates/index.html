<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4f1">
    <title>双机阈值控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">ESP8266 / 本地网络</p>
        <h1>双机阈值控制台</h1>
      </div>
      <div class="network-state" id="networkState" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span>等待设备</span>
      </div>
    </header>

    <main>
      <section class="mode-band" aria-labelledby="modeTitle">
        <div>
          <h2 id="modeTitle">阈值检测</h2>
          <p>A0 高于 0.600 V 时，从机 GPIO4 和主机 D0 同时点亮。</p>
        </div>
        <label class="switch-control">
          <input id="thresholdEnabled" type="checkbox" checked>
          <span class="switch-track" aria-hidden="true"><span></span></span>
          <span id="modeLabel">自动检测</span>
        </label>
      </section>

      <section class="alert-band" id="alertBand" hidden aria-live="assertive">
        <strong>电压大于阈值</strong>
        <span>两台设备的指示灯已联动点亮</span>
      </section>

      <section class="devices" aria-label="设备状态与手动控制">
        <article class="device" data-device="slave">
          <header class="device-head">
            <div><p class="eyebrow">COM11 / 从机</p><h2>ADC 采集端</h2></div>
            <span class="device-online" id="slaveOnline">离线</span>
          </header>
          <div class="device-body">
            <div class="lamp" id="slaveLamp" aria-label="从机灯状态"><span></span></div>
            <dl class="metrics">
              <div><dt>GPIO4 LED</dt><dd id="slaveLed">—</dd></div>
              <div><dt>A0 电压</dt><dd id="adcVoltage">—</dd></div>
              <div><dt>A0 原始值</dt><dd id="adcRaw">—</dd></div>
              <div><dt>设备地址</dt><dd id="slaveIp">—</dd></div>
            </dl>
          </div>
          <div class="manual-control">
            <span>手动控制</span>
            <div class="segmented" role="group" aria-label="从机 LED 手动控制">
              <button type="button" data-role="slave" data-led="true">打开</button>
              <button type="button" data-role="slave" data-led="false">关闭</button>
            </div>
          </div>
        </article>

        <article class="device" data-device="master">
          <header class="device-head">
            <div><p class="eyebrow">COM10 / 主机</p><h2>阈值监测端</h2></div>
            <span class="device-online" id="masterOnline">离线</span>
          </header>
          <div class="device-body">
            <div class="lamp" id="masterLamp" aria-label="主机灯状态"><span></span></div>
            <dl class="metrics">
              <div><dt>D0 LED</dt><dd id="masterLed">—</dd></div>
              <div><dt>阈值结果</dt><dd id="thresholdResult">—</dd></div>
              <div><dt>告警上报</dt><dd id="masterAlert">—</dd></div>
              <div><dt>设备地址</dt><dd id="masterIp">—</dd></div>
            </dl>
          </div>
          <div class="manual-control">
            <span>手动控制</span>
            <div class="segmented" role="group" aria-label="主机 LED 手动控制">
              <button type="button" data-role="master" data-led="true">打开</button>
              <button type="button" data-role="master" data-led="false">关闭</button>
            </div>
          </div>
        </article>
      </section>

      <section class="wave-section" aria-labelledby="waveTitle">
        <header class="section-head">
          <div><h2 id="waveTitle">从机 A0 波形</h2><p>最近 15 秒，虚线表示 0.600 V 阈值。</p></div>
          <dl class="inline-stats">
            <div><dt>采样率</dt><dd id="sampleRate">—</dd></div>
            <div><dt>窗口范围</dt><dd id="adcRange">—</dd></div>
          </dl>
        </header>
        <div class="chart-wrap"><canvas id="adcChart" width="1100" height="340" aria-label="从机 A0 波形"></canvas></div>
      </section>

      <p class="command-status" id="commandStatus" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
